name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC federated login to Azure — no stored Azure secrets.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --configuration Release

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Bicep owns all app settings and is fed the secrets via REORDER_* env vars.
      - name: Deploy infrastructure (Bicep)
        shell: pwsh
        env:
          REORDER_JOB_KEY: ${{ secrets.JOB_KEY }}
          REORDER_ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          REORDER_WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: ./scripts/deploy-infra.ps1

      - name: Deploy application
        shell: pwsh
        run: ./scripts/deploy-app.ps1

      - name: Smoke test /health
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: curl --fail --show-error --silent --retry 5 --retry-all-errors --max-time 120 "$APP_URL/health"
