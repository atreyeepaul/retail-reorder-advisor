name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publish-profile deploy — no Azure AD / OIDC, so it works on a tenant that blocks app
# registration, as long as SCM basic auth is enabled on the web app. App code only; infra
# (Bicep) changes are still applied with ./scripts/deploy-infra.ps1 by an Owner.
permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  WEBAPP_NAME: reorder-vmtiy7-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        run: dotnet publish src/Reorder.Web/Reorder.Web.csproj --configuration Release --output publish/web

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish/web

      - name: Smoke test /health
        run: curl --fail --show-error --silent --retry 5 --retry-all-errors --max-time 120 "https://${{ env.WEBAPP_NAME }}.azurewebsites.net/health"
